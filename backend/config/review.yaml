app:
  env: development
  port: 17087
  grpc_port: 17058
  base_url: http://localhost:17087
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 17433
  user: dev_user
  password: dev_password
  name: review_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: services/review/migrations

redis:
  addr: localhost:17380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:17092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:17790

# Review only VERIFIES tokens — public key suffices.
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

outbox:
  tick_every: 2s
  batch_size: 50
  max_attempts: 5

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:17051
order_service:
  grpc_addr: localhost:17054
store_service:
  grpc_addr: localhost:17053

minio:
  endpoint: "localhost:17090"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "veloxfood"
  use_ssl: false
