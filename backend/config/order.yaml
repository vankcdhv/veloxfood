app:
  env: development
  port: 17083
  grpc_port: 17054
  base_url: http://localhost:17083
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 17433
  user: dev_user
  password: dev_password
  name: order_db
  ssl_mode: disable

redis:
  addr: localhost:17380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:17092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:17790

# Order only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

# Transactional outbox dispatcher (order publishes order.* events to Kafka).
outbox:
  tick_every: 2s
  batch_size: 50
  max_attempts: 5

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:17051
location_service:
  grpc_addr: localhost:17052
store_service:
  grpc_addr: localhost:17053
promotion_service:
  grpc_addr: localhost:17055
payment_service:
  grpc_addr: localhost:17056
