app:
  env: development
  port: 17081
  grpc_port: 17052
  base_url: http://localhost:17081
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 17433
  user: dev_user
  password: dev_password
  name: location_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: services/location/migrations

redis:
  addr: localhost:17380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:17092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:17790

# Location only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

# user-service gRPC endpoint for cross-service permission checks.
user_service:
  grpc_addr: localhost:17051
