app:
  env: development
  port: 17080
  grpc_port: 17051
  base_url: http://localhost:17080
  # Auth cookies: secure=false over plain HTTP in dev; empty domain = host-only.
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 17433
  user: dev_user
  password: dev_password
  name: user_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: services/user/migrations

redis:
  addr: localhost:17380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:17092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:17790

jwt:
  private_key_path: secrets/jwt_private.pem
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

otp:
  ttl: 5m
  max_attempts: 5

smtp:
  host: smtp.mailtrap.io
  port: 587
  username: ""
  password: ""
  from: noreply@smartcanteen.local
  tls_enabled: true

outbox:
  tick_every: 2s
  batch_size: 50
  max_attempts: 5

google_oauth:
  client_id: "194202809974-gr217ea4e9bk7uv25rbifdclsjqg4ual.apps.googleusercontent.com"
  # client_secret: KHÔNG commit — inject qua env GOOGLE_OAUTH_CLIENT_SECRET khi chạy local
  client_secret: ""
  redirect_uri: "http://localhost:17080/api/v1/auth/google/callback"

minio:
  endpoint: "localhost:17090"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "veloxfood"
  use_ssl: false
