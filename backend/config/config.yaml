app:
  env: development
  port: 8080
  grpc_port: 50051
  base_url: http://localhost:8080
  # Auth cookies: secure=false over plain HTTP in dev; empty domain = host-only.
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 5433
  user: dev_user
  password: dev_password
  name: user_db
  ssl_mode: disable

redis:
  addr: localhost:6380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:19092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:36790

jwt:
  private_key_path: secrets/jwt_private.pem
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

otp:
  ttl: 5m
  max_attempts: 5

smtp:
  host: smtp.mailtrap.io
  port: 587
  username: ""
  password: ""
  from: noreply@smartcanteen.local
  tls_enabled: true

outbox:
  tick_every: 2s
  batch_size: 50
  max_attempts: 5
