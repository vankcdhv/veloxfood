app:
  env: production
  port: 8085
  grpc_port: 50056
  base_url: http://payment-service:8085
  cookie_secure: false
  cookie_domain: ""

database:
  host: postgres
  port: 5432
  user: dev_user
  password: dev_password
  name: payment_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: /migrations

redis:
  addr: redis:6379
  password: ""
  db: 0

kafka:
  brokers:
    - kafka:9092

rabbitmq:
  url: amqp://dev_user:dev_password@rabbitmq:5672/

dtm:
  addr: dtm:36790

jwt:
  private_key_path: ""
  public_key_path: /secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

outbox:
  tick_every: 2s
  batch_size: 50
  max_attempts: 5

momo:
  endpoint: https://test-payment.momo.vn/v2/gateway/api/create
  partner_code: MOMO
  access_key: F8BBA842ECF85
  secret_key: K951B6PE1waDMi640xX08PD3vg6EkVlz
  # Unlike every other address in this file, these two are consumed OUTSIDE the
  # compose network — the customer's browser follows redirect_url, and MoMo's
  # servers call ipn_url. They must therefore use the published gateway address,
  # never the in-container port (8085), which is unreachable from the host and
  # answers "connection refused". Override both when the stack is not on
  # localhost (public tunnel, LAN or Tailscale address); MoMo cannot reach a
  # localhost ipn_url at all, so a real IPN needs a publicly routable host.
  redirect_url: http://localhost:17000/api/v1/payments/momo/return
  ipn_url: http://localhost:17000/api/v1/payments/momo/ipn
  env: demo

user_service:
  grpc_addr: user-service:50051

store_service:
  grpc_addr: store-service:50053

# Distributed tracing (Jaeger via monitoring profile). Empty = disabled.
otel:
  endpoint: jaeger:4317
