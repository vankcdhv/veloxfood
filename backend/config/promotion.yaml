app:
  env: development
  port: 17084
  grpc_port: 17055
  base_url: http://localhost:17084
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 17433
  user: dev_user
  password: dev_password
  name: promotion_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: services/promotion/migrations

redis:
  addr: localhost:17380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:17092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:17790

# Promotion only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

minio:
  endpoint: "localhost:17090"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "veloxfood"
  use_ssl: false

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:17051
store_service:
  grpc_addr: localhost:17053

promotion:
  reserve_ttl: 15m

# Distributed tracing (Jaeger via monitoring profile). Empty = disabled.
otel:
  endpoint: localhost:17094
