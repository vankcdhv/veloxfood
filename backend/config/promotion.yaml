app:
  env: development
  port: 8084
  grpc_port: 50055
  base_url: http://localhost:8084
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 5433
  user: dev_user
  password: dev_password
  name: promotion_db
  ssl_mode: disable

redis:
  addr: localhost:6380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:19092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:36790

# Promotion only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "veloxfood"
  use_ssl: false

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:50051
store_service:
  grpc_addr: localhost:50053
