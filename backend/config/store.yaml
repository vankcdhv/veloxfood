app:
  env: development
  port: 8082
  grpc_port: 50053
  base_url: http://localhost:8082
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 5433
  user: dev_user
  password: dev_password
  name: store_db
  ssl_mode: disable

redis:
  addr: localhost:6380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:19092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:36790

# Store only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

# Transactional outbox dispatcher (store publishes store.* events to Kafka).
outbox:
  tick_every: 2s
  batch_size: 50
  max_attempts: 5

# Object storage for menu item images.
minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "veloxfood"
  use_ssl: false

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:50051
location_service:
  grpc_addr: localhost:50052
