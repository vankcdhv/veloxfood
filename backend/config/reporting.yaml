app:
  env: development
  port: 8088
  grpc_port: 0
  base_url: http://localhost:8088
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 5433
  user: dev_user
  password: dev_password
  name: reporting_db
  ssl_mode: disable

redis:
  addr: localhost:6380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:19092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:36790

# Reporting only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:50051
