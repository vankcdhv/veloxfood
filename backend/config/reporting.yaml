app:
  env: development
  port: 17088
  grpc_port: 0
  base_url: http://localhost:17088
  cookie_secure: false
  cookie_domain: ""

database:
  host: localhost
  port: 17433
  user: dev_user
  password: dev_password
  name: reporting_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: services/reporting/migrations

redis:
  addr: localhost:17380
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:17092

rabbitmq:
  url: amqp://dev_user:dev_password@localhost:5672/

dtm:
  addr: localhost:17790

# Reporting only VERIFIES tokens — public key suffices (no private key, no issuing).
jwt:
  private_key_path: ""
  public_key_path: secrets/jwt_public.pem
  private_key_pem: ""
  public_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

# Cross-service gRPC endpoints.
user_service:
  grpc_addr: localhost:17051

store_service:
  grpc_addr: localhost:17053
