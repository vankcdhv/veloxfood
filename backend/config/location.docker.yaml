app:
  env: production
  port: 8081
  grpc_port: 50052
  base_url: http://localhost:8081
  cookie_secure: false
  cookie_domain: ""

database:
  host: postgres
  port: 5432
  user: dev_user
  password: dev_password
  name: location_db
  ssl_mode: disable
  auto_migrate: true
  migrations_path: /migrations

redis:
  addr: redis:6379
  password: ""
  db: 0

kafka:
  brokers:
    - kafka:9092

rabbitmq:
  url: amqp://dev_user:dev_password@rabbitmq:5672/

dtm:
  addr: dtm:36790

jwt:
  private_key_path: ""
  public_key_path: ""
  public_key_pem: ""
  private_key_pem: ""
  access_ttl: 15m
  refresh_ttl: 168h

user_service:
  grpc_addr: user-service:50051

# Distributed tracing (Jaeger via monitoring profile). Empty = disabled.
otel:
  endpoint: jaeger:4317
