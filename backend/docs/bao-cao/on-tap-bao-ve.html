<title>VeloxFood — Ôn tập bảo vệ đồ án hệ phân tán</title>
<style>
/* Bảng màu lấy từ chính chủ đề báo cáo: sổ cái kế toán và phiếu điều vận.
   Nền sáng là giấy sổ cái ám xanh lá; nhấn là đỏ mực con dấu — dùng đúng cho
   thao tác bù trừ / rollback, nên màu mang nghĩa chứ không trang trí. */
:root {
  --paper:        #EDF1EE;
  --paper-raised: #F7F9F7;
  --paper-sunken: #E2E8E4;
  --rule:         #C9D3CD;
  --rule-strong:  #A9B7B0;

  --ink:          #101A24;
  --ink-soft:     #43535E;
  --ink-faint:    #74838B;

  --stamp:        #B4472E;  /* nhấn — bù trừ, rollback, con dấu */
  --stamp-wash:   #F3DED8;

  --ok:           #2E7D5B;  /* succeed */
  --ok-wash:      #DCEBE3;
  --wait:         #B07A1F;  /* prepared / chờ */
  --wait-wash:    #F2E6CD;
  --dead:         #6B7A82;  /* chưa chạy / vô hiệu */
  --dead-wash:    #E4E9E7;
  --link:         #2C5C8F;

  --owner-van:    #2C5C8F;
  --owner-duc:    #7A5BA6;
  --owner-nam:    #2E7D5B;

  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-body:    "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-mono:    "JetBrains Mono", "SF Mono", "Cascadia Mono", ui-monospace, "Menlo", monospace;

  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  --measure: 68ch;
  --rail: 260px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:        #131A1F;
    --paper-raised: #1B242B;
    --paper-sunken: #0D1317;
    --rule:         #2C3941;
    --rule-strong:  #445560;

    --ink:          #E6EDF0;
    --ink-soft:     #A3B2BA;
    --ink-faint:    #71838D;

    --stamp:        #E0745A;
    --stamp-wash:   #3A241F;

    --ok:           #59C295;
    --ok-wash:      #17332A;
    --wait:         #D9A441;
    --wait-wash:    #33290F;
    --dead:         #6E8189;
    --dead-wash:    #202A30;
    --link:         #6FA8DC;

    --owner-van:    #6FA8DC;
    --owner-duc:    #B18BE0;
    --owner-nam:    #59C295;
  }
}

/* Nút chuyển theme của trình xem đóng dấu data-theme lên root — phải thắng
   media query ở CẢ HAI chiều, nên định nghĩa lại token cho từng chiều. */
:root[data-theme="dark"] {
  --paper: #131A1F; --paper-raised: #1B242B; --paper-sunken: #0D1317;
  --rule: #2C3941; --rule-strong: #445560;
  --ink: #E6EDF0; --ink-soft: #A3B2BA; --ink-faint: #71838D;
  --stamp: #E0745A; --stamp-wash: #3A241F;
  --ok: #59C295; --ok-wash: #17332A;
  --wait: #D9A441; --wait-wash: #33290F;
  --dead: #6E8189; --dead-wash: #202A30;
  --link: #6FA8DC;
  --owner-van: #6FA8DC; --owner-duc: #B18BE0; --owner-nam: #59C295;
}

:root[data-theme="light"] {
  --paper: #EDF1EE; --paper-raised: #F7F9F7; --paper-sunken: #E2E8E4;
  --rule: #C9D3CD; --rule-strong: #A9B7B0;
  --ink: #101A24; --ink-soft: #43535E; --ink-faint: #74838B;
  --stamp: #B4472E; --stamp-wash: #F3DED8;
  --ok: #2E7D5B; --ok-wash: #DCEBE3;
  --wait: #B07A1F; --wait-wash: #F2E6CD;
  --dead: #6B7A82; --dead-wash: #E4E9E7;
  --link: #2C5C8F;
  --owner-van: #2C5C8F; --owner-duc: #7A5BA6; --owner-nam: #2E7D5B;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; font-weight: 600; }
code, kbd, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
a { color: var(--link); }

:focus-visible {
  outline: 2px solid var(--stamp);
  outline-offset: 2px;
  border-radius: 2px;
}

/* ── Thanh đầu trang ─────────────────────────────────────────── */
.masthead {
  border-bottom: 1px solid var(--rule-strong);
  background: var(--paper-raised);
  position: sticky; top: 0; z-index: 20;
}
.masthead-inner {
  max-width: 1180px; margin: 0 auto;
  padding: var(--s4) var(--s5) 0;
  display: flex; flex-direction: column; gap: var(--s3);
}
.wordmark { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.wordmark h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.wordmark .sub {
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint);
}

.tabs { display: flex; gap: var(--s5); overflow-x: auto; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  font-family: var(--font-body); font-size: 15px; color: var(--ink-soft);
  padding: var(--s2) 0 var(--s3);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  display: flex; align-items: center; gap: var(--s2);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tab-accent, var(--stamp)); font-weight: 600; }
.tab .count {
  font-family: var(--font-mono); font-size: 11px;
  padding: 1px 6px; border-radius: 9px;
  background: var(--paper-sunken); color: var(--ink-faint);
}
.tab[aria-selected="true"] .count { background: var(--tab-accent, var(--stamp)); color: var(--paper-raised); }

/* ── Bố cục hai cột ──────────────────────────────────────────── */
.shell {
  max-width: 1180px; margin: 0 auto;
  padding: var(--s6) var(--s5) var(--s8);
  display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: var(--s7);
  align-items: start;
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; gap: var(--s5); }
  .rail { position: static !important; border-right: 0; }
}

.rail { position: sticky; top: 96px; }
.rail-title {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-faint);
  padding-bottom: var(--s2); border-bottom: 1px solid var(--rule);
  margin-bottom: var(--s3);
}
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail a {
  display: flex; gap: var(--s2); align-items: baseline;
  text-decoration: none; color: var(--ink-soft);
  font-size: 14px; line-height: 1.35;
  padding: var(--s2) var(--s2) var(--s2) var(--s3);
  border-left: 2px solid transparent;
}
.rail a:hover { color: var(--ink); background: var(--paper-raised); }
.rail a.on { color: var(--ink); border-left-color: var(--tab-accent, var(--stamp)); font-weight: 600; }
.rail .n {
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
  min-width: 1.6em;
}
.rail a.has-scene .n::after { content: "▸"; color: var(--stamp); margin-left: 2px; }

.column { min-width: 0; display: flex; flex-direction: column; gap: var(--s7); }

/* ── Thẻ khái niệm ───────────────────────────────────────────── */
.card { scroll-margin-top: 110px; display: flex; flex-direction: column; gap: var(--s4); }
.card > header { display: flex; flex-direction: column; gap: var(--s2); }
.card h2 { margin: 0; font-size: 27px; line-height: 1.2; }
.eyebrow {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-faint);
  display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center;
}
.eyebrow .req {
  color: var(--ink); background: var(--paper-sunken);
  padding: 1px 6px; border: 1px solid var(--rule);
}
.lede { margin: 0; max-width: var(--measure); color: var(--ink-soft); }

/* Khối "câu phải nói" — thứ duy nhất được đóng dấu accent */
.say {
  border-left: 3px solid var(--stamp);
  background: var(--stamp-wash);
  padding: var(--s4) var(--s5);
  max-width: var(--measure);
  display: flex; flex-direction: column; gap: var(--s2);
}
.say .label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--stamp);
}
.say p { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.55; }
.say p + p { margin-top: var(--s2); }

/* Hỏi sâu */
.probe { max-width: var(--measure); display: flex; flex-direction: column; }
.probe > .label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-faint);
  padding-bottom: var(--s2); border-bottom: 1px solid var(--rule); margin-bottom: var(--s2);
}
.probe details { border-bottom: 1px solid var(--rule); }
.probe summary {
  cursor: pointer; padding: var(--s3) 0; list-style: none;
  display: flex; gap: var(--s3); align-items: baseline;
}
.probe summary::-webkit-details-marker { display: none; }
.probe summary::before {
  content: "Q"; font-family: var(--font-mono); font-size: 11px;
  color: var(--stamp); font-weight: 700;
}
.probe summary:hover { color: var(--stamp); }
.probe details[open] summary { font-weight: 600; }
.probe .a {
  padding: 0 0 var(--s4) calc(11px + var(--s3));
  color: var(--ink-soft); font-size: 15px;
}
.probe .a strong { color: var(--ink); }

/* Nguồn code */
.srcs { display: flex; flex-wrap: wrap; gap: var(--s2); }
.src {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--ink-soft); background: var(--paper-raised);
  border: 1px solid var(--rule); padding: 3px 8px;
}

/* ── Khung hoạt cảnh ─────────────────────────────────────────── */
.scene {
  border: 1px solid var(--rule-strong);
  background: var(--paper-raised);
  display: flex; flex-direction: column;
}
.scene-bar {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  padding: var(--s3) var(--s4);
  border-bottom: 1px solid var(--rule);
  background: var(--paper-sunken);
}
.scene-bar .name {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-soft); margin-right: auto;
}
.scene-stage { padding: var(--s5) var(--s4); overflow-x: auto; }
.scene-foot {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4);
  border-top: 1px solid var(--rule);
  background: var(--paper-sunken);
  flex-wrap: wrap;
}
.scene-note {
  margin-right: auto; font-size: 14px; color: var(--ink-soft);
  min-height: 1.5em; max-width: 60ch;
}
.scene-note b { color: var(--ink); }
.scene-note .hit { color: var(--stamp); font-weight: 600; }

/* Điều khiển */
button.ctl, select.ctl {
  font-family: var(--font-body); font-size: 13px;
  color: var(--ink); background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  padding: 5px 12px; cursor: pointer;
}
button.ctl:hover:not(:disabled) { border-color: var(--ink-soft); }
button.ctl:disabled { opacity: 0.4; cursor: default; }
button.ctl.go { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.ctl.go:hover { background: var(--stamp); border-color: var(--stamp); }
button.ctl.fault {
  color: var(--stamp); border-color: var(--stamp);
  font-family: var(--font-mono); font-size: 12px;
}
button.ctl.fault[aria-pressed="true"] { background: var(--stamp); color: var(--paper-raised); }
label.ctl-wrap {
  display: flex; align-items: center; gap: var(--s2);
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint);
}
.steps {
  font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint);
  letter-spacing: 0.06em;
}

/* ── Sequence diagram (SVG) ──────────────────────────────────── */
svg.seq { display: block; width: 100%; height: auto; min-width: 560px; overflow: visible; }

.seq-life { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 2 4; }

.seq-actor rect { fill: var(--paper-sunken); stroke: var(--rule-strong); stroke-width: 1; }
.seq-actor-name {
  fill: var(--ink); font-family: var(--font-body); font-size: 13px; font-weight: 600;
  text-anchor: middle;
}
.seq-actor-sub {
  fill: var(--ink-faint); font-family: var(--font-mono); font-size: 10px;
  text-anchor: middle; letter-spacing: 0.03em;
}

/* Dải sáng đánh dấu bước đang chạy — thay cho việc tô nền cả hàng */
.seq-now-band { fill: var(--paper-sunken); }

.seq-msg { color: var(--ok); transition: opacity 160ms ease; }
.seq-msg.fail,
.seq-msg.comp { color: var(--stamp); }
.seq-msg.wait { color: var(--wait); }
.seq-msg.dead { color: var(--dead); }
.seq-msg.future { opacity: 0.22; }

.seq-line { stroke: currentColor; stroke-width: 1.5; }
.seq-msg.comp .seq-line { stroke-dasharray: 6 3; }
.seq-msg.now .seq-line { stroke-width: 2.5; }
.seq-tip { fill: currentColor; }
.seq-dot { fill: currentColor; }

.seq-label-bg { fill: var(--paper-raised); }
.seq-msg.now .seq-label-bg { fill: var(--paper-sunken); }
.seq-label {
  fill: currentColor; font-family: var(--font-mono); font-size: 11px;
  text-anchor: middle; letter-spacing: 0.01em;
}
.seq-msg.now .seq-label { font-weight: 700; }
.seq-msg.dead .seq-label { fill: var(--ink-faint); }

/* ── Máy trạng thái (SVG) ────────────────────────────────────── */
svg.fsm { display: block; width: 100%; height: auto; min-width: 560px; }

.fsm-node circle { fill: var(--paper); stroke: var(--rule-strong); stroke-width: 1.5; }
.fsm-node.on circle { fill: currentColor; stroke: currentColor; stroke-width: 2; }
.fsm-node-label {
  fill: var(--ink-faint); font-family: var(--font-mono); font-size: 12px;
  font-weight: 700; letter-spacing: 0.06em; text-anchor: middle;
}
.fsm-node-sub {
  fill: var(--ink-faint); font-family: var(--font-mono); font-size: 10px; text-anchor: middle;
}
.fsm-node.on .fsm-node-label,
.fsm-node.on .fsm-node-sub { fill: var(--paper-raised); }

.fsm-edge { stroke: currentColor; stroke-width: 1.25; opacity: 0.55; }
.fsm-tip { fill: currentColor; opacity: 0.55; }
.fsm-edge-label {
  fill: currentColor; font-family: var(--font-mono); font-size: 10.5px;
  text-anchor: middle; opacity: 0.9;
}

/* ── Ô số liệu lớn ───────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s3); margin-top: var(--s5); }
.stat {
  border: 1px solid var(--rule); background: var(--paper);
  padding: var(--s3) var(--s4);
  display: flex; flex-direction: column; gap: 2px;
}
.stat-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-faint);
}
.stat-value {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 26px; font-weight: 700; line-height: 1.25; color: var(--ink);
}
.stat-hint { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.stat.ok   { border-color: var(--ok);    background: var(--ok-wash); }
.stat.ok   .stat-value { color: var(--ok); }
.stat.bad  { border-color: var(--stamp); background: var(--stamp-wash); }
.stat.bad  .stat-value { color: var(--stamp); }
.stat.warn { border-color: var(--wait);  background: var(--wait-wash); }
.stat.warn .stat-value { color: var(--wait); }
.stat.hot  { box-shadow: inset 0 0 0 1px currentColor; }

/* Chip trạng thái */
.chip {
  font-family: var(--font-mono); font-size: 11px;
  padding: 1px 7px; border: 1px solid currentColor; white-space: nowrap;
}
.chip.ok   { color: var(--ok);    background: var(--ok-wash); }
.chip.fail { color: var(--stamp); background: var(--stamp-wash); }
.chip.wait { color: var(--wait);  background: var(--wait-wash); }
.chip.dead { color: var(--dead);  background: var(--dead-wash); }

/* Bảng số liệu trong hoạt cảnh */
table.grid { border-collapse: collapse; width: 100%; font-size: 14px; }
table.grid th, table.grid td {
  border: 1px solid var(--rule); padding: var(--s2) var(--s3); text-align: left;
}
table.grid th {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-faint);
  background: var(--paper-sunken); font-weight: 400;
}
table.grid td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
table.grid tr.flash td { background: var(--wait-wash); }
table.grid td.strike { text-decoration: line-through; color: var(--ink-faint); }

/* Bảng nội dung thường (ngoài hoạt cảnh) */
.tablewrap { overflow-x: auto; max-width: 100%; }
.tablewrap table { border-collapse: collapse; font-size: 14px; min-width: 460px; }
.tablewrap th, .tablewrap td { border-bottom: 1px solid var(--rule); padding: var(--s2) var(--s4) var(--s2) 0; text-align: left; vertical-align: top; }
.tablewrap th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 400; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">
      <h1>VeloxFood — Ôn tập bảo vệ</h1>
      <span class="sub">INT4409 · Hệ phân tán · Văn · Đức · Nam</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="shell" id="shell">
  <aside class="rail" id="rail"></aside>
  <div class="column" id="column"></div>
</main>
<script>
/* Engine hoạt cảnh dùng chung.
 *
 * Mỗi hoạt cảnh khai báo:
 *   - controls: các nút / dropdown "gây lỗi" — đổi giá trị thì dựng lại kịch bản
 *   - build(opts) -> [{ view, note }]  : mảng bước, mỗi bước là HTML tĩnh
 *
 * Engine lo phần chung: khung, thanh điều khiển, bấm tới/lui, đếm bước.
 * Không có animation theo thời gian — người xem tự bấm từng bước, nên lúc bảo vệ
 * có thể dừng ở đúng khung hình cần giải thích.
 */
window.VF = window.VF || {};
VF.scenes = {};

VF.scene = function (id, def) { VF.scenes[id] = def; };

/* ── Nguyên liệu vẽ dùng chung ─────────────────────────────── */
VF.esc = function (s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
};

/* Sơ đồ tuần tự vẽ bằng SVG — mỗi service là một ĐƯỜNG ĐỜI dọc, mỗi lời gọi là
 * một mũi tên bắc ngang giữa hai đường đời. Đây là ký pháp chuẩn của sequence
 * diagram: có đường đời thì mắt mới bám được "ai đang nói với ai", còn danh sách
 * mũi tên rời rạc thì không.
 *
 * rows: [{ from, to, label, cls }] — chỉ số cột; cls ∈ ok|fail|comp|wait|dead
 * now:  chỉ số hàng đang chạy (hàng sau bị làm mờ, hàng này được tô đậm)
 *
 * Bù trừ (comp) vẽ NÉT ĐỨT màu mực dấu — nhìn là biết ngay đây là đường lùi. */
VF.lanes = function (lanes, rows, now) {
  var n = lanes.length;
  var W = 880, PAD = 16, HEAD = 56, ROW = 48, TOP = HEAD + 26;
  var H = TOP + rows.length * ROW + 14;
  var colW = (W - 2 * PAD) / n;
  var x = function (i) { return PAD + colW * (i + 0.5); };

  var s = '<svg class="seq" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
          'preserveAspectRatio="xMidYMid meet">';

  // Đường đời — kẻ trước để mũi tên nằm đè lên
  lanes.forEach(function (l, i) {
    s += '<line class="seq-life" x1="' + x(i) + '" y1="' + (HEAD + 2) + '" x2="' + x(i) + '" y2="' + (H - 8) + '"/>';
  });

  // Hộp tên service
  lanes.forEach(function (l, i) {
    var bw = Math.min(colW - 16, 190);
    s += '<g class="seq-actor">' +
         '<rect x="' + (x(i) - bw / 2) + '" y="8" width="' + bw + '" height="42" rx="2"/>' +
         '<text class="seq-actor-name" x="' + x(i) + '" y="26">' + VF.esc(l.name) + '</text>' +
         '<text class="seq-actor-sub" x="' + x(i) + '" y="41">' + VF.esc(l.sub || '') + '</text>' +
         '</g>';
  });

  rows.forEach(function (r, i) {
    var y = TOP + i * ROW;
    var cls = 'seq-msg ' + (r.cls || 'ok') +
              (i > now ? ' future' : '') + (i === now ? ' now' : '');
    var x1 = x(r.from), x2 = x(r.to);
    s += '<g class="' + cls + '">';

    if (i === now) {
      s += '<rect class="seq-now-band" x="' + PAD + '" y="' + (y - 20) + '" ' +
           'width="' + (W - 2 * PAD) + '" height="' + (ROW - 6) + '"/>';
    }

    if (r.from === r.to) {
      // Lời gọi tự thân: cung vuông quay lại chính mình (retry, chờ, crash)
      var w = 34;
      s += '<path class="seq-line" d="M' + x1 + ' ' + (y - 7) + ' h' + w +
           ' v14 h-' + (w - 8) + '" fill="none"/>' +
           arrowHead(x1 + 9, y + 7, -1) +
           // style thắng được CSS .seq-label{text-anchor:middle}; thuộc tính thường thì không
           '<text class="seq-label" style="text-anchor:start" x="' + (x1 + w + 12) + '" y="' + (y + 4) + '">' +
           VF.esc(r.label) + '</text>';
    } else {
      var dir = x2 > x1 ? 1 : -1;
      var tip = x2 - dir * 7;
      s += '<line class="seq-line" x1="' + x1 + '" y1="' + y + '" x2="' + tip + '" y2="' + y + '"/>' +
           '<circle class="seq-dot" cx="' + x1 + '" cy="' + y + '" r="2.5"/>' +
           arrowHead(x2, y, dir);

      var mid = (x1 + x2) / 2;
      var tw = r.label.length * 6.1 + 14;
      s += '<rect class="seq-label-bg" x="' + (mid - tw / 2) + '" y="' + (y - 17) + '" ' +
           'width="' + tw + '" height="15" />' +
           '<text class="seq-label" x="' + mid + '" y="' + (y - 5) + '">' + VF.esc(r.label) + '</text>';
    }
    s += '</g>';
  });

  return s + '</svg>';

  function arrowHead(px, py, dir) {
    var b = px - dir * 8;
    return '<path class="seq-tip" d="M' + px + ' ' + py + ' L' + b + ' ' + (py - 4.5) +
           ' L' + b + ' ' + (py + 4.5) + ' Z"/>';
  }
};

/* Ô số liệu lớn — dùng cho những con số PHẢI đập vào mắt (8 chứ không phải 16,
 * 5.055ms so với 25ms). tone ∈ ok|bad|warn|mute */
VF.stat = function (cards) {
  return '<div class="stats">' + cards.map(function (c) {
    return '<div class="stat ' + (c.tone || 'mute') + (c.hot ? ' hot' : '') + '">' +
      '<div class="stat-label">' + VF.esc(c.label) + '</div>' +
      '<div class="stat-value">' + c.value + '</div>' +
      (c.hint ? '<div class="stat-hint">' + c.hint + '</div>' : '') +
      '</div>';
  }).join('') + '</div>';
};

/* ── Khung + vòng đời một hoạt cảnh ────────────────────────── */
VF.mount = function (host, id) {
  var def = VF.scenes[id];
  if (!def) { host.innerHTML = '<p class="scene-note">Thiếu hoạt cảnh: ' + VF.esc(id) + '</p>'; return; }

  var opts = {};
  (def.controls || []).forEach(function (c) { opts[c.id] = c.value; });

  var steps = [], i = 0;

  var bar = document.createElement('div'); bar.className = 'scene-bar';
  var stage = document.createElement('div'); stage.className = 'scene-stage';
  var foot = document.createElement('div'); foot.className = 'scene-foot';

  bar.innerHTML = '<span class="name">' + VF.esc(def.title) + '</span>';

  (def.controls || []).forEach(function (c) {
    if (c.kind === 'select') {
      var wrap = document.createElement('label');
      wrap.className = 'ctl-wrap';
      wrap.append(c.label);
      var sel = document.createElement('select');
      sel.className = 'ctl';
      c.options.forEach(function (o) {
        var op = document.createElement('option');
        op.value = o[0]; op.textContent = o[1];
        if (o[0] === c.value) op.selected = true;
        sel.append(op);
      });
      sel.addEventListener('change', function () { opts[c.id] = sel.value; rebuild(); });
      wrap.append(sel);
      bar.append(wrap);
    } else {
      var b = document.createElement('button');
      b.className = 'ctl fault';
      b.textContent = c.label;
      b.setAttribute('aria-pressed', String(!!c.value));
      b.addEventListener('click', function () {
        opts[c.id] = !opts[c.id];
        b.setAttribute('aria-pressed', String(opts[c.id]));
        rebuild();
      });
      bar.append(b);
    }
  });

  var note = document.createElement('p'); note.className = 'scene-note';
  var count = document.createElement('span'); count.className = 'steps';
  var prev = document.createElement('button'); prev.className = 'ctl'; prev.textContent = '◀ Trước';
  var next = document.createElement('button'); next.className = 'ctl go'; next.textContent = 'Sau ▶';
  var again = document.createElement('button'); again.className = 'ctl'; again.textContent = '↺';
  again.title = 'Về bước đầu';
  foot.append(note, count, again, prev, next);

  prev.addEventListener('click', function () { if (i > 0) { i--; draw(); } });
  next.addEventListener('click', function () { if (i < steps.length - 1) { i++; draw(); } });
  again.addEventListener('click', function () { i = 0; draw(); });

  function draw() {
    stage.innerHTML = steps[i].view;
    note.innerHTML = steps[i].note || '';
    count.textContent = 'Bước ' + (i + 1) + '/' + steps.length;
    prev.disabled = i === 0;
    next.disabled = i === steps.length - 1;
  }
  function rebuild() { steps = def.build(opts); i = 0; draw(); }

  host.classList.add('scene');
  host.append(bar, stage, foot);
  rebuild();
};

VF.mountAll = function (root) {
  root.querySelectorAll('[data-scene]').forEach(function (el) {
    if (el.dataset.mounted) return;
    el.dataset.mounted = '1';
    VF.mount(el, el.dataset.scene);
  });
};
/* Saga đặt hàng — 3 nhánh, bù trừ chạy NGƯỢC.

    });

/* Bảng nhánh, dựng giống hệt màn DTM UI thầy sẽ nhìn thấy lúc demo */
function sagaBranchTable(failAt) {
  var rows;
  if (failAt === 'none') {
    rows = [
      ['01', 'action', 'succeed', 'ApplyPromotion'],
      ['02', 'action', 'succeed', 'Capture'],
      ['03', 'action', 'succeed', 'ConfirmUsage']
    ];
  } else if (failAt === 'apply') {
    rows = [
      ['01', 'action', 'failed', 'ApplyPromotion'],
      ['01', 'compensate', 'succeed', 'ReleaseUsage'],
      ['02', 'action', 'prepared', 'Capture'],
      ['03', 'action', 'prepared', 'ConfirmUsage']
    ];
  } else if (failAt === 'capture') {
    rows = [
      ['01', 'action', 'succeed', 'ApplyPromotion'],
      ['01', 'compensate', 'succeed', 'ReleaseUsage'],
      ['02', 'action', 'failed', 'Capture'],
      ['02', 'compensate', 'succeed', 'Refund'],
      ['03', 'action', 'prepared', 'ConfirmUsage']
    ];
  } else {
    rows = [
      ['01', 'action', 'succeed', 'ApplyPromotion'],
      ['01', 'compensate', 'succeed', 'ReleaseUsage'],
      ['02', 'action', 'succeed', 'Capture'],
      ['02', 'compensate', 'succeed', 'Refund'],
      ['03', 'action', 'failed', 'ConfirmUsage'],
      ['03', 'compensate', 'succeed', 'ReleaseUsage']
    ];
  }
  var cls = { succeed: 'ok', failed: 'fail', prepared: 'wait' };
  var h = '<p style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;' +
          'text-transform:uppercase;color:var(--ink-faint);margin:24px 0 8px">' +
          'Màn DTM UI sẽ hiện đúng thế này</p>';
  h += '<table class="grid"><thead><tr><th>branch</th><th>op</th><th>status</th><th>RPC</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    h += '<tr><td class="num">' + r[0] + '</td><td>' + r[1] +
         '</td><td><span class="chip ' + cls[r[2]] + '">' + r[2] + '</span></td>' +
         '<td><code>' + r[3] + '</code></td></tr>';
  });
  return h + '</tbody></table>';
}

        barrierState(o.off ? [] : [['02', 'action', 'đã ghi']], 423000));

      rows.push({ from: P, to: D, label: '✔ succeed — nhưng gói tin MẤT', cls: 'fail' });
      push('Payment trả lời succeed, nhưng <span class="hit">gói tin trả lời rơi giữa đường</span>. DTM không nhận được ⇒ nó tưởng nhánh này chưa chạy.',
        barrierState(o.off ? [] : [['02', 'action', 'đã ghi']], 423000));

      rows.push({ from: D, to: P, label: 'Capture (lần 2 — retry)', cls: 'wait' });
      push('DTM <b>retry</b>. Đây không phải bug — <b>mọi</b> hệ phân tán đều phải retry, vì không thể phân biệt “service chết” với “trả lời bị mất”.',
        barrierState(o.off ? [] : [['02', 'action', 'đã ghi']], 423000));

      if (o.off) {
        rows.push({ from: P, to: B, label: 'trừ ví LẦN NỮA', cls: 'fail' });
        steps.push({
          view: VF.lanes(L, rows, rows.length - 1) + barrierState([], 346000),
          note: '<b>Khách bị trừ tiền hai lần.</b> Ví <code>500.000 → 423.000 → 346.000</code> cho <b>một</b> đơn. Đây là <b>duplicate branch call</b> — và nó xảy ra ở mọi hệ thống retry mà không khử trùng lặp.'
        });
      } else {
        rows.push({ from: P, to: B, label: 'INSERT barrier → trùng khoá', cls: 'wait' });
        push('Payment thử ghi lại dòng barrier <code>(gid, 02, action)</code>. Khoá chính trùng ⇒ <b>INSERT thất bại</b>. Payment hiểu ngay: “việc này tôi làm rồi”.',
          barrierState([['02', 'action', 'đã có — CHẶN']], 423000));
        rows.push({ from: P, to: D, label: '✔ succeed (bỏ qua, không trừ lại)', cls: 'ok' });
        steps.push({
          view: VF.lanes(L, rows, rows.length - 1) + barrierState([['02', 'action', 'đã ghi']], 423000),
          note: '<b>Ví vẫn 423.000.</b> Barrier biến <code>Capture</code> thành <b>idempotent</b>: gọi bao nhiêu lần cũng chỉ trừ một lần. Và nó làm được thế <b>không cần</b> Payment tự nghĩ ra cơ chế khử trùng lặp riêng.'
        });
      }
      return steps;
    }

    // Bài toán 2 — null compensation / bù trừ vượt trước
    rows.push({ from: D, to: P, label: 'Capture', cls: 'wait' });
    push('DTM gọi <code>Capture</code>, nhưng <span class="hit">gói tin đi rất chậm</span> (nghẽn mạng). Payment chưa nhận được.',
      barrierState([], 500000));

    rows.push({ from: D, to: P, label: '↩ Refund (bù trừ)', cls: 'comp' });
    push('DTM hết kiên nhẫn (deadline), coi nhánh 2 là hỏng, và gọi <b>bù trừ</b>. <code>Refund</code> <b>đến trước</b> <code>Capture</code>.',
      barrierState([], 500000));

    if (o.off) {
      rows.push({ from: P, to: B, label: 'Refund: không có gì để hoàn → LỖI', cls: 'fail' });
      push('Không có barrier ⇒ Payment tra bảng, không thấy payment nào, và <b>báo lỗi</b>. DTM thấy bù trừ hỏng ⇒ <b>retry mãi mãi</b>.',
        barrierState([], 500000));
      rows.push({ from: D, to: P, label: 'Capture (gói tin chậm, giờ mới tới)', cls: 'fail' });
      steps.push({
        view: VF.lanes(L, rows, rows.length - 1) + barrierState([], 423000),
        note: '<b>Thảm hoạ.</b> <code>Capture</code> lết tới sau khi bù trừ đã chạy ⇒ <b>trừ tiền của một đơn đã bị huỷ</b>, và <b>không bao giờ có ai hoàn lại</b>. Tiền mất vĩnh viễn. Đây là <b>dangling action</b> — kèm theo <b>null compensation</b> (bù trừ cho việc chưa xảy ra) làm saga treo.'
      });
    } else {
      rows.push({ from: P, to: B, label: 'ghi barrier (gid, 02, compensate)', cls: 'comp' });
      push('Có barrier: <code>Refund</code> vẫn <b>ghi dòng chặn</b> rồi trả <b>succeed</b> mà <b>không hoàn đồng nào</b> — vì đúng là chưa trừ đồng nào. Đây chính là <b>null compensation</b>, và nó phải là <b>no-op</b>.',
        barrierState([['02', 'compensate', 'đã ghi']], 500000));
      rows.push({ from: D, to: P, label: 'Capture (gói tin chậm, giờ mới tới)', cls: 'wait' });
      push('Gói tin <code>Capture</code> lết tới. Payment ghi barrier <code>(gid, 02, action)</code> và <b>nhìn thấy dòng compensate đã có trước</b>.',
        barrierState([['02', 'compensate', 'đã ghi'], ['02', 'action', 'đến SAU compensate']], 500000));
      rows.push({ from: P, to: D, label: '✔ succeed (bỏ qua — KHÔNG trừ tiền)', cls: 'ok' });
      steps.push({
        view: VF.lanes(L, rows, rows.length - 1) + barrierState([['02', 'compensate', 'đã ghi'], ['02', 'action', 'BỊ CHẶN']], 500000),
        note: '<b>Ví vẫn nguyên 500.000.</b> Barrier chặn được cả action đến muộn. Câu để nói: <i>“Barrier ghi một dòng chặn trong cùng transaction với business write. Nó giải hai bài toán: <b>gọi trùng nhánh</b> và <b>null compensation</b> — và cả trường hợp action lết tới sau khi đã bù trừ.”</i>'
      });
    }
    return steps;
  }
});

function barrierState(bars, wallet) {
  // 500.000 = nguyên vẹn · 423.000 = trừ đúng một lần · 346.000 = trừ hai lần (bug)
  var tone = wallet === 346000 ? 'bad' : (wallet === 500000 ? 'ok' : 'mute');
  var hint = wallet === 346000 ? 'ĐÃ TRỪ HAI LẦN cho một đơn'
           : wallet === 423000 ? 'trừ đúng một lần'
           : 'chưa trừ đồng nào';

  var h = VF.stat([{ label: 'Ví khách', value: wallet.toLocaleString('vi-VN') + ' đ', tone: tone, hint: hint }]);

  h += '<table class="grid" style="margin-top:12px"><thead><tr>' +
       '<th>dtm_barrier — branch</th><th>op</th><th>ghi chú</th></tr></thead><tbody>';
  if (!bars.length) {
    h += '<tr><td colspan="3" style="color:var(--ink-faint)">— trống —</td></tr>';
  } else {
    bars.forEach(function (b) {
      var hot = /CHẶN/.test(b[2]);
      h += '<tr' + (hot ? ' class="flash"' : '') + '><td class="num">' + b[0] + '</td><td class="mono">' +
           b[1] + '</td><td class="mono">' + VF.esc(b[2]) + '</td></tr>';
    });
  }
  return h + '</tbody></table>';
}
/* Transactional Outbox — vì sao không được "ghi DB xong rồi publish Kafka".
   Bật/tắt outbox rồi crash ở đúng khe hở để thấy sự kiện bốc hơi. */
VF.scene('transactional-outbox', {
  title: 'Transactional Outbox',
  controls: [
    { kind: 'toggle', id: 'naive', label: '⚡ Bỏ outbox (ghi DB rồi publish thẳng)', value: false },
    { kind: 'toggle', id: 'crash', label: '⚡ Service chết giữa chừng', value: true }
  ],

  build: function (o) {
    var L = [
      { name: 'Order', sub: 'service' },
      { name: 'order_db', sub: 'Postgres' },
      { name: 'Dispatcher', sub: 'worker 2s' },
      { name: 'Kafka', sub: 'order.events' }
    ];
    var S = 0, DB = 1, W = 2, K = 3;
    var steps = [], rows = [];
    function push(note, extra) {
      steps.push({ view: VF.lanes(L, rows.slice(), rows.length - 1) + (extra || ''), note: note });
    }

    if (o.naive) {
      rows.push({ from: S, to: DB, label: 'INSERT order · COMMIT', cls: 'ok' });
      push('Cách ngây thơ: ghi đơn, commit. Đơn <b>đã có thật</b> trong DB.',
        outboxState([['ĐƠN', 'đã commit', 'ok']], [], false));

      if (o.crash) {
        rows.push({ from: S, to: S, label: '💥 process chết', cls: 'fail' });
        steps.push({
          view: VF.lanes(L, rows, rows.length - 1) + outboxState([['ĐƠN', 'đã commit', 'ok']], [], false),
          note: '<span class="hit">Khe hở chết người.</span> Đơn <b>đã nằm trong DB</b> nhưng sự kiện <code>order.placed</code> <b>chưa bao giờ được phát</b>. Notification không báo khách, Reporting không thấy doanh thu, Delivery không biết có đơn cần giao. <b>Hệ thống lệch nhau vĩnh viễn</b> — và không ai biết, vì API đã trả <code>201</code> cho khách rồi.'
        });
      } else {
        rows.push({ from: S, to: K, label: 'publish order.placed', cls: 'ok' });
        push('Không chết thì vẫn chạy đúng. <b>Vấn đề là bạn không điều khiển được lúc nào process chết.</b> Bật nút “service chết” để thấy.',
          outboxState([['ĐƠN', 'đã commit', 'ok']], [], true));
      }
      return steps;
    }

    rows.push({ from: S, to: DB, label: 'INSERT order + INSERT outbox — MỘT tx', cls: 'ok' });
    push('Cách đúng: đơn và <b>bản ghi sự kiện</b> được ghi trong <b>cùng một transaction</b>. Không có Kafka nào ở đây cả — chỉ là hai lệnh INSERT vào <b>cùng một database</b>.',
      outboxState([['ĐƠN', 'đã commit', 'ok']], [['order.placed', 'PENDING']], false));

    if (o.crash) {
      rows.push({ from: S, to: S, label: '💥 process chết', cls: 'fail' });
      push('Process chết đúng chỗ hiểm. Nhưng lần này <b>sự kiện đã nằm an toàn trong DB</b>, cùng chỗ với đơn hàng.',
        outboxState([['ĐƠN', 'đã commit', 'ok']], [['order.placed', 'PENDING']], false));
      rows.push({ from: W, to: DB, label: 'quét bảng outbox (mỗi 2s)', cls: 'wait' });
      push('Service sống lại. Dispatcher quét bảng <code>outbox</code>, thấy dòng <code>PENDING</code> còn đó.',
        outboxState([['ĐƠN', 'đã commit', 'ok']], [['order.placed', 'PENDING']], false));
    } else {
      rows.push({ from: W, to: DB, label: 'quét bảng outbox (mỗi 2s)', cls: 'wait' });
      push('Dispatcher chạy nền, quét bảng <code>outbox</code>.',
        outboxState([['ĐƠN', 'đã commit', 'ok']], [['order.placed', 'PENDING']], false));
    }

    rows.push({ from: W, to: K, label: 'publish order.placed', cls: 'ok' });
    rows.push({ from: W, to: DB, label: 'đánh dấu SENT', cls: 'ok' });
    steps.push({
      view: VF.lanes(L, rows, rows.length - 1) + outboxState([['ĐƠN', 'đã commit', 'ok']], [['order.placed', 'SENT']], true),
      note: '<b>Sự kiện vẫn được phát.</b> Câu để nói: <i>“Sự kiện được ghi <b>cùng transaction</b> với business write, nên không bao giờ có chuyện đơn tạo rồi mà sự kiện mất. Đổi lại, dispatcher có thể phát <b>trùng</b> (crash sau publish, trước khi đánh dấu SENT) — nên phía nhận <b>bắt buộc</b> phải idempotent.”</i> Đó chính là <b>at-least-once</b>, và là lý do phần của Nam tồn tại.'
    });
    return steps;
  }
});

function outboxState(orders, events, published) {
  var h = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px">';
  h += '<table class="grid"><thead><tr><th>order_db — bảng orders</th><th>trạng thái</th></tr></thead><tbody>';
  orders.forEach(function (r) { h += '<tr><td class="mono">' + r[0] + '</td><td><span class="chip ok">' + r[1] + '</span></td></tr>'; });
  h += '</tbody></table>';
  h += '<table class="grid"><thead><tr><th>order_db — bảng outbox</th><th>trạng thái</th></tr></thead><tbody>';
  if (!events.length) {
    h += '<tr><td colspan="2" style="color:var(--stamp)">— không tồn tại —</td></tr>';
  } else {
    events.forEach(function (r) {
      h += '<tr><td class="mono">' + r[0] + '</td><td><span class="chip ' +
           (r[1] === 'SENT' ? 'ok' : 'wait') + '">' + r[1] + '</span></td></tr>';
    });
  }
  h += '</tbody></table></div>';
  h += '<table class="grid" style="margin-top:12px"><thead><tr><th>Kafka — topic order.events</th></tr></thead><tbody><tr><td>' +
       (published
         ? '<span class="chip ok">order.placed</span> — consumer nhận được'
         : '<span class="chip dead">— trống —</span>') +
       '</td></tr></tbody></table>';
  return h;
}
/* Circuit breaker — máy trạng thái + số đo THẬT của Demo 2.

VF.scene('circuit-breaker', {

  controls: [],

  build: function () {

      ['⚡ docker compose stop store-service', null, null, 'closed',

      ['request #2', 3432, 400, 'closed',

      ['request #3', 361, 400, 'closed', 'Đếm tiếp: 3/3 lỗi.'],
      ['request #4', 358, 400, 'closed', 'Đếm tiếp: 4/4 lỗi. <b>Vẫn chưa mở</b> — ngưỡng là <b>≥5 request trong 30 giây</b>.'],
      ['request #5', 360, 400, 'open',
       '<span class="hit">Mạch MỞ.</span> Đủ hai điều kiện: <b>≥5 request/30s</b> <b>VÀ</b> <b>≥60% lỗi hạ tầng</b>. Gauge <code>circuit_breaker_state</code> nhảy lên <b>2</b>.'],

      ['request #7', 24, 400, 'open',

/* Máy trạng thái vẽ bằng SVG: ba nút tròn + các cung chuyển trạng thái có nhãn
   điều kiện. Nhìn thấy CUNG mới hiểu vì sao nó chuyển, chứ ba cái hộp cạnh nhau
   thì chỉ là ba cái hộp. */
function breakerMachine(state) {
  // H phải chứa cả cung vòng dưới (đáy của nó ở cy + r + 52 = 200) — thiếu là bị cắt
  var W = 880, H = 216, cy = 108, r = 40;
  var nodes = [
    { id: 'closed', x: 130, label: 'ĐÓNG', sub: 'gauge 0', color: 'var(--ok)' },
    { id: 'open', x: 440, label: 'MỞ', sub: 'gauge 2', color: 'var(--stamp)' },
    { id: 'half', x: 750, label: 'HALF-OPEN', sub: 'gauge 1', color: 'var(--wait)' }
  ];
  var s = '<svg class="fsm" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img">';

  s += fsmEdge(130 + r, 440 - r, cy, '≥5 req/30s VÀ ≥60% lỗi hạ tầng', 'up', 'var(--stamp)');
  s += fsmEdge(440 + r, 750 - r, cy, 'sau Timeout 15s', 'up', 'var(--wait)');
  s += fsmEdge(750 - r, 440 + r, cy, '1 probe hỏng → mở lại', 'down', 'var(--stamp)');
  // Cung dài half-open → closed, vòng dưới cả sơ đồ
  s += '<path class="fsm-edge" style="color:var(--ok)" fill="none" d="M750 ' + (cy + r) +
       ' q0 52 -70 52 H200 q-70 0 -70 -52"/>' +
       '<path class="fsm-tip" style="color:var(--ok)" d="M130 ' + (cy + r) + ' l5 9 l-10 0 Z"/>' +
       '<text class="fsm-edge-label" style="color:var(--ok)" x="440" y="' + (cy + 68) + '">' +
       '3 probe thành công → đóng lại</text>';

  nodes.forEach(function (n) {
    var on = n.id === state;
    s += '<g class="fsm-node' + (on ? ' on' : '') + '" style="color:' + n.color + '">' +
         '<circle cx="' + n.x + '" cy="' + cy + '" r="' + r + '"/>' +
         '<text class="fsm-node-label" x="' + n.x + '" y="' + (cy - 2) + '">' + n.label + '</text>' +
         '<text class="fsm-node-sub" x="' + n.x + '" y="' + (cy + 14) + '">' + n.sub + '</text>' +
         '</g>';
  });
  return s + '</svg>';
}

function fsmEdge(x1, x2, cy, label, bend, color) {
  var lift = bend === 'up' ? -46 : 46;
  var my = cy + lift;
  var dir = x2 > x1 ? 1 : -1;
  var tip = x2 - dir * 2;
  return '<path class="fsm-edge" style="color:' + color + '" fill="none" ' +
         'd="M' + x1 + ' ' + cy + ' Q' + ((x1 + x2) / 2) + ' ' + my + ' ' + tip + ' ' + cy + '"/>' +
         '<path class="fsm-tip" style="color:' + color + '" d="M' + x2 + ' ' + cy +
         ' l' + (-dir * 9) + ' ' + (lift > 0 ? 3 : -3) + ' l' + (-dir * 2) + ' 8 Z"/>' +
         '<text class="fsm-edge-label" style="color:' + color + '" x="' + ((x1 + x2) / 2) + '" y="' +
         (cy + lift * 0.75) + '">' + VF.esc(label) + '</text>';
}

function breakerLog(rows, state) {
  if (!rows.length) return '';
  var h = '<table class="grid" style="margin-top:24px"><thead><tr>' +
          '<th>Lời gọi</th><th style="text-align:right">Độ trễ</th><th>HTTP</th><th>Mạch</th>' +
          '</tr></thead><tbody>';
  rows.forEach(function (r, i) {
    var last = i === rows.length - 1;
    var slow = r[1] >= 3000, fast = r[1] <= 30;
    h += '<tr' + (last ? ' class="flash"' : '') + '><td class="mono">' + VF.esc(r[0]) + '</td>' +
         '<td class="num" style="' + (slow ? 'color:var(--stamp);font-weight:700' : fast ? 'color:var(--ok);font-weight:700' : '') + '">' +
         r[1].toLocaleString('vi-VN') + ' ms</td>' +

function partitionLog(cur, committed, stuck) {
  var msgs = [
    [3, 'order.placed', 'đã xử lý'],
    [4, 'order.paid', 'đã xử lý'],
    [5, 'order.status_changed (JSON hỏng)', 'ĐANG KẸT'],
    [6, 'order.cancelled', 'chờ'],
    [7, 'order.delivered', 'chờ']
  ];
  var h = '<table class="grid" style="margin-top:24px"><thead><tr>' +
          '<th>offset</th><th>message trong partition 0</th><th>trạng thái</th></tr></thead><tbody>';
  msgs.forEach(function (m) {
    var isCur = m[0] === cur;
    var done = m[0] <= committed;
    var cls = done ? 'ok' : isCur ? (stuck ? 'fail' : 'wait') : 'dead';
    var label = done ? 'đã commit' : isCur ? (stuck ? '⛔ KẸT — không commit' : 'đang xử lý') : 'chờ tới lượt';
    h += '<tr' + (isCur ? ' class="flash"' : '') + '><td class="num">' + m[0] + '</td>' +
         '<td class="mono">' + VF.esc(m[1]) + '</td>' +
         '<td><span class="chip ' + cls + '">' + label + '</span></td></tr>';
  });
  h += '</tbody></table>';
  if (stuck) {
    h += '<p style="font-family:var(--font-mono);font-size:12px;color:var(--stamp);margin-top:12px">' +
         'Con trỏ commit đứng im ở offset 4. Offset 6, 7 <b>không được xử lý vượt mặt</b> — thứ tự partition được giữ.</p>';
  }
  return h;
}

function idemState(processed, notifs, hot) {
  var wrong = notifs === 16;
  return VF.stat([
    {
      label: 'Kafka đã giao',
      value: hot ? '16 lần' : '8 lần',
      tone: 'mute',
      hint: hot ? 'giao lại toàn bộ sau khi tua offset' : 'lần chạy đầu tiên'
    },
    {
      label: 'processed_events',
      value: processed === 0 ? '—' : processed + ' dòng',
      tone: processed === 0 ? 'bad' : 'mute',
      hint: processed === 0 ? 'bảng bị TẮT — không có gì chặn trùng' : 'khoá chính = event_id'
    },
    {
      label: 'Thông báo gửi khách',

function cqrsLatency(write, read) {
  return VF.stat([
    {
      label: 'Khách chờ bao lâu',
      value: write === null ? '…' : write.toLocaleString('vi-VN') + ' ms',
      tone: write === null ? 'mute' : (write > 1000 ? 'bad' : 'ok'),
      hint: write === null ? 'đang xử lý'
          : (write > 1000 ? 'mọi khách trả giá cho báo cáo của admin' : 'ghi đơn xong là trả lời ngay')
    },
    {
      label: 'Dashboard trễ bao lâu',
      value: read === null ? '…' : (read === 0 ? '0 ms' : '~' + (read / 1000) + ' giây'),
      tone: 'mute',
      hint: read === 0 ? 'chính xác tuyệt đối — nhưng phải trả giá bên trái'
          : (read === null ? 'chưa cập nhật' : 'nhất quán cuối — chấp nhận có ý thức')
    }
  ]);
}

function rtState(tokens, verdict) {
  var h = '<table class="grid" style="margin-top:24px"><thead><tr><th>Refresh token</th><th>trạng thái trên server</th></tr></thead><tbody>';
  tokens.forEach(function (t) {
    var dead = /THU HỒI|thu hồi/.test(t[1]);
    h += '<tr><td class="mono' + (dead ? ' strike' : '') + '">' + t[0] + '</td>' +
         '<td><span class="chip ' + (dead ? 'dead' : 'ok') + '">' + VF.esc(t[1]) + '</span></td></tr>';
  });
  h += '</tbody></table>';
  if (verdict) {
    var bad = /oan/.test(verdict);
    h += '<p style="font-family:var(--font-mono);font-size:14px;margin-top:12px;font-weight:700;color:' +
         (bad ? 'var(--stamp)' : 'var(--ok)') + '">Kết cục: ' + VF.esc(verdict) + '</p>';
  }
  return h;
}

function fmtSigned(n) {
  return (n > 0 ? '+' : '−') + Math.abs(n).toLocaleString('vi-VN');
}

function ledgerTable(entries, wallet, sys, broken, done) {
  var sum = entries.reduce(function (a, e) { return a + e[1]; }, 0);
  var h = '<table class="grid"><thead><tr><th>Bút toán</th><th>Tài khoản</th><th style="text-align:right">Số tiền</th></tr></thead><tbody>';
  if (!entries.length) {
    h += '<tr><td colspan="3" style="color:var(--ink-faint)">— chưa có bút toán —</td></tr>';
  } else {
    entries.forEach(function (e, i) {
      h += '<tr' + (i === entries.length - 1 ? ' class="flash"' : '') + '><td class="num">' + (i + 1) +
           '</td><td class="mono">' + VF.esc(e[0]) + '</td><td class="num" style="color:' +
           (e[1] < 0 ? 'var(--stamp)' : 'var(--ok)') + ';font-weight:600">' + fmtSigned(e[1]) + ' đ</td></tr>';
    });
    var okSum = sum === 0;
    h += '<tr><td></td><td class="mono" style="font-weight:700">TỔNG</td>' +
         '<td class="num" style="font-weight:700;color:' + (okSum ? 'var(--ok)' : 'var(--stamp)') + '">' +
         (okSum ? '0 ✔ cân' : fmtSigned(sum) + ' ✖ LỆCH') + '</td></tr>';
  }
  h += '</tbody></table>';

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px">';
  h += '<table class="grid"><thead><tr><th>Số dư ví khách</th></tr></thead><tbody><tr><td class="num" style="font-size:18px">' +
       wallet.toLocaleString('vi-VN') + ' đ</td></tr></tbody></table>';
  h += '<table class="grid"><thead><tr><th>Số dư SYSTEM (clearing)</th></tr></thead><tbody><tr><td class="num" style="font-size:18px;color:' +
       (sys < 0 ? 'var(--wait)' : 'inherit') + '">' + fmtSigned(sys).replace('+', '') + ' đ' +
       (sys < 0 ? ' <span style="font-size:11px">← âm là ĐÚNG</span>' : '') +
       '</td></tr></tbody></table></div>';

  if (broken) {
    h += '<p style="font-family:var(--font-mono);font-size:12px;color:var(--stamp);margin-top:12px">' +
         '42.000đ rời khỏi ví khách nhưng không vào tài khoản nào. Sổ sách không thể đối soát.</p>';
  }
  return h;
}

/* Ráp trang: tab → rail mục lục → các thẻ khái niệm → gắn hoạt cảnh. */
(function () {
  var TABS = ['tongquan', 'van', 'duc', 'nam', 'hoicheo'];

  var tabsEl = document.getElementById('tabs');
  var railEl = document.getElementById('rail');
  var colEl = document.getElementById('column');
  var shell = document.getElementById('shell');

  function cardHTML(c) {
    var h = '<section class="card" id="' + c.id + '"><header>';
    if (c.eyebrow && c.eyebrow.length) {
      h += '<div class="eyebrow">' + c.eyebrow.map(function (e, i) {
        return i === 0 ? '<span class="req">' + e + '</span>' : '<span>' + e + '</span>';
      }).join('') + '</div>';
    }
    h += '<h2>' + c.title + '</h2>';
    if (c.lede) h += '<p class="lede">' + c.lede + '</p>';
    h += '</header>';

    if (c.scene) h += '<div data-scene="' + c.scene + '"></div>';
    if (c.html) h += '<div class="freeform">' + c.html + '</div>';

    if (c.say && c.say.length) {
      h += '<div class="say"><span class="label">Câu phải nói</span>' +
           c.say.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>';
    }

    if (c.probes && c.probes.length) {
      h += '<div class="probe"><span class="label">Nếu thầy hỏi sâu</span>';
      c.probes.forEach(function (p) {
        h += '<details><summary>' + p[0] + '</summary><div class="a">' + p[1] + '</div></details>';
      });
      h += '</div>';
    }

    if (c.srcs && c.srcs.length) {
      h += '<div class="srcs">' + c.srcs.map(function (s) {
        return '<span class="src">' + VF.esc(s) + '</span>';
      }).join('') + '</div>';
    }

    return h + '</section>';
  }

  function render(key) {
    var data = VF.content[key];
    shell.style.setProperty('--tab-accent', data.accent);

    railEl.innerHTML = '<div class="rail-title">' + VF.esc(data.label) + '</div><ol>' +
      data.cards.map(function (c, i) {
        return '<li><a href="#' + c.id + '"' + (c.scene ? ' class="has-scene"' : '') + '>' +
               '<span class="n">' + (i + 1) + '</span><span>' + stripTags(c.title) + '</span></a></li>';
      }).join('') + '</ol>';

    colEl.innerHTML = '<p class="lede" style="font-size:18px;border-bottom:1px solid var(--rule);padding-bottom:24px;margin:0">' +
      data.blurb + '</p>' + data.cards.map(cardHTML).join('');

    VF.mountAll(colEl);
    spy();
    window.scrollTo(0, 0);
  }

  function stripTags(s) { return s.replace(/<[^>]+>/g, ''); }

  /* Tô sáng mục đang đọc trong rail */
  function spy() {
    var links = Array.prototype.slice.call(railEl.querySelectorAll('a'));
    var cards = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
    function update() {
      var best = 0;
      cards.forEach(function (c, i) {
        if (c && c.getBoundingClientRect().top < 160) best = i;
      });
      links.forEach(function (a, i) { a.classList.toggle('on', i === best); });
    }
    window.removeEventListener('scroll', window.__vfSpy);
    window.__vfSpy = update;
    window.addEventListener('scroll', update, { passive: true });
    update();
  }

  TABS.forEach(function (key, i) {
    var d = VF.content[key];
    var b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(i === 0));
    b.innerHTML = VF.esc(d.label) + (d.tally ? '<span class="count">' + d.tally + '</span>' : '');
    b.addEventListener('click', function () {
      tabsEl.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
      b.setAttribute('aria-selected', 'true');
      location.hash = '#tab=' + key;
      render(key);
    });
    tabsEl.append(b);
  });

  var start = (location.hash.match(/^#tab=(\w+)$/) || [])[1];
  if (TABS.indexOf(start) < 0) start = 'tongquan';
  tabsEl.querySelectorAll('.tab')[TABS.indexOf(start)].setAttribute('aria-selected', 'true');
  tabsEl.querySelectorAll('.tab')[0].setAttribute('aria-selected', String(start === 'tongquan'));
  render(start);
})();
</script>
