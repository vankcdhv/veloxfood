<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Parse JSON from Docker's "log" field (slog JSON output)
<filter service.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</filter>

# Docker driver puts the stream name in `source` (string), conflicting with
# slog's source object (file/function/line). Flatten slog's source to caller_*
# and let the Docker `source` stay (renamed to stream).
<filter service.**>
  @type record_transformer
  enable_ruby true
  <record>
    caller_file    ${record["source"].is_a?(Hash) ? record["source"]["file"]     : nil}
    caller_line    ${record["source"].is_a?(Hash) ? record["source"]["line"]     : nil}
    caller_func    ${record["source"].is_a?(Hash) ? record["source"]["function"] : nil}
    stream         ${record["source"].is_a?(String) ? record["source"] : nil}
  </record>
  remove_keys source
</filter>

# Output to Elasticsearch
<match service.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix service-logs
  logstash_dateformat %Y.%m.%d
  suppress_type_name true
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  # Avoid the ES 8 compatibility-header probe that breaks plugin 5.4.3
  verify_es_version_at_startup false
  default_elasticsearch_version 8

  <buffer tag,time>
    @type file
    path /fluentd/log/es-buffer
    timekey 1h
    timekey_wait 1m
    chunk_limit_size 8MB
    flush_mode interval
    flush_interval 10s
    retry_type exponential_backoff
    retry_timeout 72h
    retry_max_interval 30s
    flush_at_shutdown true
  </buffer>
</match>

<match **>
  @type null
</match>
