services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - logging

  fluentd:
    build:
      context: ./docker/fluentd
    volumes:
      - ./docker/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - fluentd_log:/fluentd/log
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - logging

  logging-init:
    image: curlimages/curl:8.10.1
    user: "0:0"
    volumes:
      - ./docker/logging-init:/scripts:ro
    environment:
      ES_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
      RETENTION_DAYS: "7"
      ROLLOVER_MAX_AGE: 1d
      ROLLOVER_MAX_SIZE: 1gb
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    restart: "no"
    networks:
      - logging

volumes:
  es_data:
  fluentd_log:

networks:
  logging:
    name: backend_logging
