syntax = "proto3";

package location.v1;

option go_package = "project/proto/location/v1;locationv1";

// Room delivery target resolved across the building/floor/room tree.
// location_id == room_id across the system.
message ResolvedRoom {
  string room_id = 1;
  string room_code = 2;
  string room_name = 3;
  string floor_id = 4;
  string floor_name = 5;
  string building_id = 6;
  string building_name = 7;
  bool active = 8;
}

message GetRoomRequest {
  string room_id = 1;
}

message GetRoomResponse {
  ResolvedRoom room = 1;
  bool found = 2;
}

// Floor delivery target resolved to its parent building.
message ResolvedFloor {
  string floor_id = 1;
  string floor_name = 2;
  string building_id = 3;
  string building_name = 4;
  bool active = 5;
}

message GetFloorRequest {
  string floor_id = 1;
}

message GetFloorResponse {
  ResolvedFloor floor = 1;
  bool found = 2;
}

// Building delivery target.
message ResolvedBuilding {
  string building_id = 1;
  string building_name = 2;
  bool active = 3;
}

message GetBuildingRequest {
  string building_id = 1;
}

message GetBuildingResponse {
  ResolvedBuilding building = 1;
  bool found = 2;
}

service LocationService {
  // GetRoom resolves a room to its full building/floor/room path for other
  // services (Store ship-fee, Order delivery address).
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  // GetFloor resolves a floor to its parent building — used when a delivery is
  // addressed at floor level (ship-fee resolution + delivery path).
  rpc GetFloor(GetFloorRequest) returns (GetFloorResponse);
  // GetBuilding resolves a building — used when a delivery is addressed at
  // building level.
  rpc GetBuilding(GetBuildingRequest) returns (GetBuildingResponse);
}
