syntax = "proto3";

package store.v1;

option go_package = "project/proto/store/v1;storev1";

// OrderItem is a single sellable item returned for order validation.
message OrderItem {
  string item_id = 1;
  string name    = 2;
  int64  price   = 3;
}

// GetStoreForOrderRequest is called by the order service before placing an order.
message GetStoreForOrderRequest {
  string store_id = 1;
  string room_id  = 2;
}

// CutoffInfo describes one delivery session (ca) so the order service can
// compute each item's actual cutoff deadline (date + cutoff_time - lead).
message CutoffInfo {
  string id           = 1;
  string cutoff_time  = 2;  // HH:MM
  int32  lead_minutes = 3;
}

message GetStoreForOrderResponse {
  bool             found            = 1;
  string           sale_status      = 2;
  int64            unit_ship_fee    = 3;
  bool             served           = 4;  // true when the room is covered by a ship fee rule
  repeated OrderItem items          = 5;
  string           order_deadline   = 6;  // ISO-8601 datetime string (latest cutoff - lead)
  repeated CutoffInfo cutoffs       = 7;  // store's ship cutoffs (for per-item deadline)
}

// DecrementSlotQuotaRequest is called when an order is placed.
message DecrementSlotQuotaRequest {
  string item_id   = 1;
  string cutoff_id = 2;
  string date      = 3; // YYYY-MM-DD
  int32  qty       = 4;
}

message DecrementSlotQuotaResponse {
  bool  ok        = 1;
  int32 remaining = 2;
}

// RestoreSlotQuotaRequest is called on saga compensation or order cancellation.
message RestoreSlotQuotaRequest {
  string item_id   = 1;
  string cutoff_id = 2;
  string date      = 3; // YYYY-MM-DD
  int32  qty       = 4;
}

message RestoreSlotQuotaResponse {
  bool ok = 1;
}

// GetStoreOwnershipRequest looks up the ownership record for a store so that
// callers can verify vendor_id without holding store data themselves.
message GetStoreOwnershipRequest {
  string store_id = 1;
}

message GetStoreOwnershipResponse {
  bool   found        = 1;
  string vendor_id    = 2;
  string owner_user_id = 3;
  string name         = 4;
}

service StoreService {
  // GetStoreForOrder assembles store availability, ship fee, and menu snapshot
  // for the order service before order placement.
  rpc GetStoreForOrder(GetStoreForOrderRequest) returns (GetStoreForOrderResponse);

  // DecrementSlotQuota atomically reduces sold count for a quota slot.
  // Returns ok=false if quota is exhausted.
  rpc DecrementSlotQuota(DecrementSlotQuotaRequest) returns (DecrementSlotQuotaResponse);

  // RestoreSlotQuota increments available quota (inverse of Decrement).
  // Called on order cancellation or saga compensation.
  rpc RestoreSlotQuota(RestoreSlotQuotaRequest) returns (RestoreSlotQuotaResponse);

  // GetStoreOwnership returns the vendor_id and owner_user_id for a store so
  // peer services (e.g. promotion) can authorise store-scoped mutations without
  // holding a local copy of store data.
  rpc GetStoreOwnership(GetStoreOwnershipRequest) returns (GetStoreOwnershipResponse);
}
