syntax = "proto3";

package store.v1;

option go_package = "project/proto/store/v1;storev1";

// OrderItem is a single sellable item returned for order validation.
message OrderItem {
  string item_id = 1;
  string name    = 2;
  int64  price   = 3;
}

// GetStoreForOrderRequest is called by the order service before placing an order.
message GetStoreForOrderRequest {
  string store_id = 1;
  // room_id carries the delivery location id at the level given by location_level
  // (room id for ROOM, floor id for FLOOR, building id for BUILDING). Empty for PICKUP.
  // Field kept named room_id for backward compatibility.
  string room_id  = 2;
  // location_level: "ROOM" | "FLOOR" | "BUILDING". Empty ⇒ treated as ROOM.
  string location_level = 3;
}

message GetStoreForOrderResponse {
  bool             found            = 1;
  string           sale_status      = 2;
  int64            unit_ship_fee    = 3;
  bool             served           = 4;  // true when the room is covered by a ship fee rule
  repeated OrderItem items          = 5;
  // Delivery-time model: prep_minutes is the store's minimum preparation time;
  // open_now reflects SaleStatus + today's operating hours; open/close_time_today
  // are today's window (HH:MM, empty when closed today). The order service uses
  // these to validate the customer's desired receive time.
  int32            prep_minutes      = 6;
  bool             open_now          = 7;
  string           open_time_today   = 8;  // HH:MM, empty if closed today
  string           close_time_today  = 9;  // HH:MM, empty if closed today
}

// GetStoreOwnershipRequest looks up the ownership record for a store so that
// callers can verify vendor_id without holding store data themselves.
message GetStoreOwnershipRequest {
  string store_id = 1;
}

message GetStoreOwnershipResponse {
  bool   found        = 1;
  string vendor_id    = 2;
  string owner_user_id = 3;
  string name         = 4;
}

service StoreService {
  // GetStoreForOrder assembles store availability, ship fee, and menu snapshot
  // for the order service before order placement.
  rpc GetStoreForOrder(GetStoreForOrderRequest) returns (GetStoreForOrderResponse);

  // GetStoreOwnership returns the vendor_id and owner_user_id for a store so
  // peer services (e.g. promotion) can authorise store-scoped mutations without
  // holding a local copy of store data.
  rpc GetStoreOwnership(GetStoreOwnershipRequest) returns (GetStoreOwnershipResponse);
}
